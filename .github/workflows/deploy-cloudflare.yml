name: Deploy to Cloudflare

# Builds the static site and uploads it to Cloudflare Workers:
#   push to dev   →  https://dev.wewillfind.it
#   push to main  →  https://wewillfind.it
# Can also be run by hand from the Actions tab (any branch other than main deploys to dev).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — an API token created from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — the account the Workers live in
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# One deployment per target at a time; let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: cloudflare-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://wewillfind.it' || 'https://dev.wewillfind.it' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        run: npm run deploy:$TARGET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
