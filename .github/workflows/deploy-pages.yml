name: Deploy to GitHub Pages

# Builds the static site (npm run build:pages → ./out) and publishes it with GitHub Pages
# whenever main is updated. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, publish to Pages, mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails fast with a clear message if Pages isn't enabled for the repo (Settings → Pages → Source: GitHub Actions)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # GITHUB_REPOSITORY is provided by Actions; it sets the /<repo>/ base path and canonical URLs.
      - name: Build static site
        run: npm run build:pages

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
